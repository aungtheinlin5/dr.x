<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dr.X</title>
<link rel="icon" type="image/png" href="https://i.ibb.co/k6PNS4bt/icon-512.png">
<style>
  :root{
    --bg:#0c0e12;
    --panel:#14171d;
    --panel2:#1b1f27;
    --line:#262b34;
    --text:#e8eaed;
    --muted:#8b93a1;
    --accent:#ff4d5e;
    --accent2:#ffb454;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:
      radial-gradient(1200px 600px at 85% -10%, rgba(255,77,94,.08), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(255,180,84,.06), transparent 60%),
      var(--bg);
    color:var(--text);
    min-height:100vh;
  }
  header{
    padding:16px 14px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:sticky;
    top:0;
    background:rgba(12,14,18,.9);
    backdrop-filter:blur(10px);
    z-index:10;
  }
  @media(min-width:560px){
    header{padding:26px 24px;}
  }
  .brand{
    font-size:12px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--accent);
    font-weight:700;
    margin-bottom:3px;
  }
  h1{margin:0; font-size:22px; font-weight:800; letter-spacing:-0.02em;}
  .back-btn{
    display:none;
    padding:9px 16px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--panel2);
    color:var(--text);
    font-size:13px;
    cursor:pointer;
    font-weight:600;
  }
  .back-btn:hover{border-color:var(--accent);}

  .ad-slot{
    display:flex;
    justify-content:center;
    align-items:center;
    width:100%;
    overflow:hidden;
  }
  .native-ad-slot{
    margin:14px auto 4px;
    min-height:40px;
  }
  .banner-ad-slot{
    margin:24px auto 0;
    min-height:300px;
  }
  main{max-width:1200px; margin:0 auto; padding:16px 14px 50px;}
  @media(min-width:560px){
    main{padding:28px 24px 60px;}
  }

  /* Grid view */
  #gridView .grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:12px;
  }
  @media(min-width:560px){
    #gridView .grid{
      grid-template-columns:repeat(3, 1fr);
      gap:16px;
    }
  }
  @media(min-width:820px){
    #gridView .grid{
      grid-template-columns:repeat(4, 1fr);
      gap:18px;
    }
  }
  @media(min-width:1100px){
    #gridView .grid{
      grid-template-columns:repeat(5, 1fr);
      gap:20px;
    }
  }
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
    cursor:pointer;
    transition:transform .18s, border-color .18s;
  }
  @media(min-width:560px){
    .card{border-radius:14px;}
  }
  .card:hover{
    transform:translateY(-4px);
    border-color:var(--accent);
  }
  .thumb-wrap{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    background:#000;
    overflow:hidden;
  }
  .thumb-wrap img{
    width:100%; height:100%; object-fit:cover;
    display:block;
  }
  .play-badge{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,0);
    transition:background .18s;
  }
  .card:hover .play-badge{background:rgba(0,0,0,.25);}
  .play-badge svg{
    width:44px; height:44px;
    opacity:0;
    transition:opacity .18s, transform .18s;
    filter:drop-shadow(0 2px 8px rgba(0,0,0,.5));
  }
  .card:hover .play-badge svg{opacity:1; transform:scale(1.05);}
  .card-info{padding:8px 9px;}
  .card-info .t{
    font-weight:700;
    font-size:12.5px;
    line-height:1.35;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .card-info .d{color:var(--muted); font-size:10.5px; margin-top:5px;}
  @media(min-width:560px){
    .card-info{padding:13px 14px;}
    .card-info .t{font-size:14.5px;}
    .card-info .d{font-size:11.5px; margin-top:6px;}
  }

  .empty, .loading{
    text-align:center;
    color:var(--muted);
    padding:80px 20px;
    font-size:14px;
  }

  /* Player view */
  #playerView{display:none;}
  .player-wrap{
    width:100%;
    aspect-ratio:16/9;
    background:#000;
    border-radius:14px;
    overflow:hidden;
    border:1px solid var(--line);
  }
  .player-wrap iframe{
    width:100%; height:100%;
    border:0; display:block;
  }
  .player-title{
    font-size:17px;
    font-weight:800;
    margin:14px 0 5px;
    letter-spacing:-0.01em;
  }
  .player-date{color:var(--muted); font-size:12px;}
  @media(min-width:560px){
    .player-title{font-size:21px; margin:20px 0 6px;}
    .player-date{font-size:13px;}
  }
</style>
</head>
<body>

<header>
  <div>
    <h1 id="headerTitle">Dr.X</h1>
  </div>
  <button class="back-btn" id="backBtn" onclick="showGrid()">← နောက်သို့</button>
</header>

<main>

  <!-- Native Banner Ad -->
  <div class="ad-slot native-ad-slot" aria-label="Advertisement">
    <script async="async" data-cfasync="false" src="https://pl31020598.profitableratecpmnetwork.com/638fdc2b59b98bbc3eb5af57e481dd4d/invoke.js"></script>
    <div id="container-638fdc2b59b98bbc3eb5af57e481dd4d"></div>
  </div>

  <div id="gridView">
    <div id="videoGrid" class="loading">Loading...</div>
  </div>

  <div id="playerView">
    <div class="player-wrap">
      <iframe id="playerFrame" src="" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
    </div>
    <div class="player-title" id="playerTitle"></div>
    <div class="player-date" id="playerDate"></div>

    <!-- 160x300 Banner Ad -->
    <div class="ad-slot banner-ad-slot" aria-label="Advertisement">
      <div>
        <script>
          atOptions = {
            'key' : '569aadc01b5a78caf9e2186e191ff4e1',
            'format' : 'iframe',
            'height' : 300,
            'width' : 160,
            'params' : {}
          };
        </script>
        <script src="https://www.highrevenueformat.com/569aadc01b5a78caf9e2186e191ff4e1/invoke.js"></script>
      </div>
    </div>
  </div>

</main>

<!-- Popunder Ad -->
<script src="https://pl31020597.profitableratecpmnetwork.com/c3/d5/4d/c3d54d8836f0968e6409d5d4aa221046.js"></script>

<script>
// ============ CONFIG ============
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzLlUUObz3RbWBnlaC50kLDfage6mDFNjljP4XI-0dYHAwFwm1EH4nCw84-lkbr3acQ/exec";
// =================================

let videos = [];

async function loadVideos(){
  const gridEl = document.getElementById('videoGrid');
  try{
    const res = await fetch(SCRIPT_URL + "?action=list");
    const data = await res.json();

    if(!data.success || data.videos.length === 0){
      gridEl.className = "empty";
      gridEl.innerHTML = "Video များ မရှိသေးပါ";
      return;
    }

    videos = data.videos;
    gridEl.className = "grid";
    gridEl.innerHTML = videos.map((v, i) => `
      <div class="card" onclick="playVideo(${i})">
        <div class="thumb-wrap">
          <img src="${v.thumbnailLink}" loading="lazy" onerror="this.src='https://via.placeholder.com/400x225/1b1f27/8b93a1?text=No+Image'">
          <div class="play-badge">
            <svg viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>
          </div>
        </div>
        <div class="card-info">
          <div class="t">${escapeHtml(v.title)}</div>
          <div class="d">${new Date(v.dateAdded).toLocaleDateString()}</div>
        </div>
      </div>
    `).join('');
  } catch(err){
    gridEl.className = "empty";
    gridEl.innerHTML = "Data ရယူရာတွင် အမှားရှိသည်။ SCRIPT_URL ကိုစစ်ဆေးပါ";
  }
}

function playVideo(index){
  const v = videos[index];
  document.getElementById('playerFrame').src = v.videoLink;
  document.getElementById('playerTitle').textContent = v.title;
  document.getElementById('playerDate').textContent = new Date(v.dateAdded).toLocaleString();

  document.getElementById('gridView').style.display = "none";
  document.getElementById('playerView').style.display = "block";
  document.getElementById('backBtn').style.display = "inline-block";
  document.getElementById('headerTitle').textContent = "ပြသနေသည်";
  window.scrollTo(0,0);
}

function showGrid(){
  document.getElementById('playerFrame').src = "";
  document.getElementById('gridView').style.display = "block";
  document.getElementById('playerView').style.display = "none";
  document.getElementById('backBtn').style.display = "none";
  document.getElementById('headerTitle').textContent = "Dr.X";
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

loadVideos();
</script>

</body>
</html>
